name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://app_user:change-me-in-production@localhost:5432/rk_kit_test
  DATABASE_URL_MIGRATIONS: postgresql://rk_kit:rk_kit_secret@localhost:5432/rk_kit_test
  RLS_TEST_ADMIN_URL: postgresql://rk_kit:rk_kit_secret@localhost:5432/rk_kit_test
  RLS_TEST_APP_URL: postgresql://app_user:change-me-in-production@localhost:5432/rk_kit_test
  BETTER_AUTH_SECRET: ci-only-secret-of-at-least-32-chars!!
  BETTER_AUTH_URL: http://localhost:3100

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rk_kit
          POSTGRES_PASSWORD: rk_kit_secret
          POSTGRES_DB: rk_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rk_kit -d rk_kit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & typecheck & build
        run: pnpm turbo run lint typecheck build

      - name: Apply database migrations
        working-directory: packages/db
        run: DATABASE_URL="$DATABASE_URL_MIGRATIONS" pnpm db:migrate

      - name: Run tests (unit + RLS integration)
        run: pnpm turbo run test

      - name: Smoke test (built server against migrated database)
        run: bash scripts/smoke.sh 3100

      - name: Check AI docs coverage
        run: bash scripts/check-ai-docs.sh
