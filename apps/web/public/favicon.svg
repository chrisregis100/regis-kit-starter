<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #0E4781; }
    .fg { fill: #FFFFFF; }
    .stroke { stroke: #FFFFFF; stroke-width: 2.5; fill: none; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #4393D6; }
      .fg { fill: #0B1220; }
      .stroke { stroke: #0B1220; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="stroke" x="7" y="7" width="18" height="18" rx="6" />
  <circle class="fg" cx="24" cy="12" r="3" />
</svg>
